<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet Nest</title>
<meta name="description" content="Offline nesting planner for laser and CNC sheet cutting.">
<meta name="theme-color" content="#0f6e56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1f1e1c;--muted:#6b6a64;--line:#dddbd2;--accent:#0f6e56;--accent-ink:#fff;--accent-soft:#e1f5ee;--danger:#a32d2d;--sheet:#efe6d4;--sheet-line:#9c8a60;--margin:#b9a77c;--sel:#d85a30;--off:#185fa5;color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--panel:#22221f;--ink:#ecebe6;--muted:#a3a19a;--line:#3a3935;--accent:#5dcaa5;--accent-ink:#04342c;--accent-soft:#0b3a2f;--danger:#f09595;--sheet:#3a3428;--sheet-line:#a8966a;--margin:#7d7050;--sel:#f0997b;--off:#85b7eb;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:600;font-size:17px;display:flex;gap:8px;align-items:center;margin-right:auto}
.brand img{width:26px;height:26px}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.fit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fit>span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--danger)}
button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
main{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto 120px}
@media(max-width:880px){main{grid-template-columns:1fr;padding:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.preset{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:12px;line-height:1.2;text-align:center}
.preset b{font-weight:600}
.preset span{color:var(--muted);font-size:11px}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.preset svg{width:58px;height:38px}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}
.row>*{flex:1}
.row>button{flex:0 0 auto}
label{display:block;font-size:12px;color:var(--muted)}
label input,label select{margin-top:2px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.summary{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px;color:var(--muted);font-size:14px}
.summary b{color:var(--ink)}
.sheet-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sheet-title strong{font-size:16px}
.spacer{flex:1}
.sheet-head{display:grid;grid-template-columns:1.3fr 1.5fr repeat(4,minmax(64px,.8fr));gap:8px;align-items:end}
@media(max-width:720px){.sheet-head{grid-template-columns:1fr 1fr 1fr}}
svg.canvas{width:100%;height:auto;display:block;margin-top:12px;touch-action:manipulation;max-height:75vh}
svg.canvas g.part{cursor:pointer}
.stats{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px}
.stats b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px}
.chip.on{border-color:var(--sel)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.warn{border-color:var(--danger)} .warn h2{color:var(--danger)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px 12px;display:none;gap:8px;align-items:flex-end;flex-wrap:wrap;width:min(900px,calc(100% - 20px))}
#bar.show{display:flex}
#bar label{flex:1 1 90px}
#bar .acts{display:flex;gap:6px;flex-wrap:wrap}
#bar .foot{flex-basis:100%;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{header,aside,#bar,.sheet-head,.chips,.sheet-title button{display:none!important}main{display:block;margin:0}.card{break-inside:avoid;border:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="icon.svg" alt="">Sheet Nest <small id="net"></small></div>
  <div class="fit">
    <span>Best fit</span>
    <div class="seg" role="group" aria-label="Best fit mode">
      <button data-act="fit" data-mode="offcut" title="Pack into one corner, leaving the largest reusable offcut">Reusable offcuts</button>
      <button data-act="fit" data-mode="spread" title="Distribute parts with even spacing on each sheet">Even spread</button>
      <button data-act="fit" data-mode="waste" title="Fill sheets as fully as possible to use the fewest sheets">Min waste</button>
    </div>
    <button data-act="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
  </div>
</header>
<main>
  <aside id="side"></aside>
  <section id="sheets" aria-live="polite"></section>
</main>
<div id="bar" role="region" aria-label="Selected part"></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr">
<script src="nest.js"></script>
<script src="app.js"></script>
</body>
</html>
